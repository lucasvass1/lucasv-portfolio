    </filter>
    <filter id="blurWide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <circle cx="980" cy="60" r="480" fill="none" stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="90" stroke-dasharray="1400 620"/>

  <ellipse cx="430" cy="530" rx="360" ry="34" fill="#000000" fill-opacity="0.35" filter="url(#blurWide)"/>

  <g stroke="#C4B5FD" stroke-opacity="0.55" stroke-width="1.5">
