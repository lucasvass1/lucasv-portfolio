<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 160) scale(560)">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 520) scale(380)">
      <stop offset="0" stop-color="#0369A1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0369A1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <circle cx="640" cy="220" r="120" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="640" cy="220" r="180" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="640" cy="220" r="240" fill="none" stroke="#38BDF8" stroke-opacity="0.05" stroke-width="1.5"/>

  <g filter="url(#blurSoft)">
    <ellipse cx="560" cy="240" rx="90" ry="66" fill="url(#cloudFill)"/>
    <ellipse cx="660" cy="210" rx="110" ry="80" fill="url(#cloudFill)"/>
    <ellipse cx="760" cy="250" rx="90" ry="64" fill="url(#cloudFill)"/>
    <ellipse cx="650" cy="270" rx="160" ry="60" fill="url(#cloudFill)"/>
  </g>
  <g stroke="#BAE6FD" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M480 270 a90 66 0 0 1 90 -66"/>
    <path d="M810 280 a90 64 0 0 0 -70 -60"/>
  </g>

  <g stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 6">
    <path d="M560 300 L420 430"/>
    <path d="M650 320 L650 460"/>
    <path d="M760 300 L880 430"/>
  </g>

  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.4">
    <rect x="380" y="430" width="80" height="80" rx="14" fill="#38BDF8" fill-opacity="0.08"/>
    <rect x="610" y="460" width="80" height="80" rx="14" fill="#38BDF8" fill-opacity="0.08"/>
    <rect x="840" y="430" width="80" height="80" rx="14" fill="#38BDF8" fill-opacity="0.08"/>
  </g>
  <g fill="#BAE6FD">
    <circle cx="420" cy="470" r="3"/>
