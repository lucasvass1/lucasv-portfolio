    </pattern>
    <linearGradient id="screenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blurWide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <ellipse cx="640" cy="500" rx="140" ry="24" fill="#000000" fill-opacity="0.4" filter="url(#blurWide)"/>

  <rect x="560" y="120" width="220" height="400" rx="34" fill="url(#screenFill)" stroke="#A5B4FC" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="580" y="150" width="180" height="60" rx="10" fill="#818CF8" fill-opacity="0.18" stroke="#818CF8" stroke-opacity="0.3"/>
  <rect x="580" y="224" width="180" height="86" rx="10" fill="#818CF8" fill-opacity="0.14" stroke="#818CF8" stroke-opacity="0.25"/>
  <rect x="580" y="322" width="86" height="86" rx="10" fill="#818CF8" fill-opacity="0.14" stroke="#818CF8" stroke-opacity="0.25"/>
  <rect x="674" y="322" width="86" height="86" rx="10" fill="#818CF8" fill-opacity="0.10" stroke="#818CF8" stroke-opacity="0.2"/>
  <rect x="620" y="480" width="100" height="16" rx="8" fill="#A5B4FC" fill-opacity="0.6"/>

